version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ["*"] }

  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /oxmpl-js
    schedule: { interval: monthly }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directories: [/, /oxmpl-py]
    schedule: { interval: monthly }
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
